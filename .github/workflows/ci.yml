# Backend CI – körs vid push och Pull Requests mot main.
# Bygger API:t; ingen deployment och inga hemligheter behövs
# (connection string används först när appen körs, inte vid bygge).
name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  ci:
    name: Restore, build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NodiaApi.slnx

      - name: Build
        run: dotnet build NodiaApi.slnx --no-restore --configuration Release

      # Restore och Build ovan körs på NodiaApi.slnx, som innehåller både API:t och
      # tests/NodiaApi.Tests – därför kan testerna köras med --no-build.
      # Integrationstesterna startar PostgreSQL via Testcontainers (Docker finns på ubuntu-latest).
      - name: Test
        run: dotnet test NodiaApi.slnx --no-build --configuration Release --logger "console;verbosity=normal"
